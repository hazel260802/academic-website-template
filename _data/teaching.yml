# Learning materials, shown on the Learning Materials page, grouped by section.
# Each section needs: section, items. Optional: term
# Each item needs: title
# Optional: course (bold label), term, description (HTML allowed), links (list of {label, url})

- section: PhD, Cnam & ECE
  term: 2026–present
  items:
    - course: Network Calculus Notes
      title: A learning series on network calculus applied to TSN
      description: >-
        Nine parts: from why TSN needs deterministic guarantees, through min-plus
        algebra, arrival and service curves, the fundamental bounds, concatenation,
        aggregate multiplexing and TSN shapers, to dynamic reconfiguration.
      links:
        - label: Read the notes
          url: https://cnam-ece.github.io/learning-materials/blog/why-deterministic-guarantees
        - label: GitHub
          url: https://github.com/CNAM-ECE

- section: Master 2 Computer Networks (CNS-SR), Université d'Évry Paris-Saclay
  term: 2025–2026
  items:
    - course: Course materials
      title: Notes, labs and project materials from the Master's programme
      links:
        - label: Google Drive folder
          url: https://drive.google.com/drive/folders/1IMzrzbUl9l7tAaeWfGr61ObpcdPIdMf8?usp=sharing
    - course: Network systems labs
      title: High availability, load balancing, data-centre networking and SDN
      description: >-
        High availability and LAN routing on <a href="https://www.openbsd.org/" target="_blank" rel="noopener">OpenBSD</a>
        (<a href="https://www.openbsd.org/faq/pf/carp.html" target="_blank" rel="noopener">CARP and PFSYNC</a>); redundant DHCP servers;
        LVS + <a href="https://www.keepalived.org/" target="_blank" rel="noopener">Keepalived</a> load-balanced clusters; NAT and packet filtering with
        <a href="https://www.netfilter.org/" target="_blank" rel="noopener">Netfilter</a>, <a href="https://www.wireshark.org/" target="_blank" rel="noopener">Wireshark</a> and tcpdump;
        a multi-site network with VLANs, LACP, MLAG and VRRP on
        <a href="https://docs.nvidia.com/networking-ethernet-software/cumulus-linux/" target="_blank" rel="noopener">Cumulus Linux</a>, automated with
        <a href="https://www.ansible.com/" target="_blank" rel="noopener">Ansible</a>; an SQL-to-<a href="https://www.mongodb.com/" target="_blank" rel="noopener">MongoDB</a>
        migration on <a href="https://podman.io/" target="_blank" rel="noopener">Podman</a>; and
        <a href="https://en.wikipedia.org/wiki/Software-defined_networking" target="_blank" rel="noopener">SDN</a> with
        <a href="https://www.opendaylight.org/" target="_blank" rel="noopener">OpenDaylight</a>, <a href="https://opennetworking.org/onos/" target="_blank" rel="noopener">ONOS</a>
        and <a href="https://github.com/noxrepo/pox" target="_blank" rel="noopener">POX</a> controllers on <a href="https://mininet.org/" target="_blank" rel="noopener">Mininet</a>.

