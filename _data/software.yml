# Software projects, shown on the Software page in the order listed.
# Each entry needs: name, description
# Optional: authors, website, repo, docs, paper, program, slides

- name: Zero-knowledge smart contracts for healthcare SLAs (Shaker Genopole)
  authors: H.-T. Le, H.-H. Vuong; supervised by A. Imeri and N. Agoulmine
  website: https://genopole.agorize.com/web/en/challenges/618/teams/2643/participation
  slides: https://docs.google.com/presentation/d/17n0wptI4n4wjyPATJ44HPGJ8dE6MdHPh/edit?usp=sharing
  description: >-
    Winning project of the <a href="https://genopole.agorize.com/web/en/challenges/618/teams/2643/participation" target="_blank" rel="noopener">Shaker Genopole Challenge</a>,
    the 6-month programme of <a href="https://www.genopole.fr/" target="_blank" rel="noopener">Genopole</a>, developed from the D4Gen Hackathon project at
    <a href="https://www.ibisc.univ-evry.fr/" target="_blank" rel="noopener">IBISC</a>. A working,
    secure prototype for traceable transmission of electronic health records on
    the <a href="https://sui.io/" target="_blank" rel="noopener">Sui</a> blockchain, with contextual access control and privacy protection
    through zero-knowledge contracts (ZKContract).

- name: "HOPPERS: LLM-based intent orchestration for medical IoT (D4Gen Hackathon 2026)"
  authors: H.-T. Le; supervised by A. Imeri, N. Agoulmine and M. Hamidi
  website: https://llm-intent-orchestration.vercel.app
  repo: https://github.com/D4GenHackathon/llm-intent-orchestration
  slides: https://docs.google.com/presentation/d/17n0wptI4n4wjyPATJ44HPGJ8dE6MdHPh/edit?usp=sharing
  description: >-
    The in-hospital AIoT component of HOPPERS (Healthcare-Oriented Privacy-Preserving
    Platform for Electronic Health Record Reliable Sharing), built for the
    <a href="https://genopole.agorize.com/en/challenges/d4gen-hackathon-2026" target="_blank" rel="noopener">D4Gen Hackathon 2026</a> organised by <a href="https://www.genopole.fr/" target="_blank" rel="noopener">Genopole</a>.
    An AI agent lets clinicians and researchers state their intents in natural language
    and orchestrates medical IoT devices through standardised
    <a href="https://modelcontextprotocol.io/" target="_blank" rel="noopener">MCP</a> interfaces, on an
    <a href="https://en.wikipedia.org/wiki/Software-defined_networking" target="_blank" rel="noopener">SDN</a>-based hospital network.
    Built with FastAPI, Next.js and <a href="https://www.crewai.com/" target="_blank" rel="noopener">CrewAI</a>, with RAG-based clinical
    decision support from real-time sensor data. Part of the
    <a href="https://github.com/D4GenHackathon" target="_blank" rel="noopener">D4GenHackathon</a> organisation at
    <a href="https://www.ibisc.univ-evry.fr/" target="_blank" rel="noopener">IBISC</a>.

- name: "SafeProof: privacy-preserving harassment reporting (ACM womENcourage 2026 Hackathon)"
  authors: >-
    Mar Toledano Moreno, Mar Becerra i Vilardaga, Xènia Fonoll González, Sílvia Borràs García,
    Leire Martínez de Treviño García, Andrea Gil Guimerà, Uxia Pérez Aguirre, Raquel Gomez Argente
    and Huyen-Trang Le
  website: https://ttgenproject.github.io/safeproof-zkp/
  repo: https://github.com/TTGenProject/safeproof-zkp
  slides: https://docs.google.com/presentation/d/1safyND00YSxTISNe_1uOfcl1YdIe6vnb/edit?usp=sharing
  description: >-
    Built by our team at the <a href="https://womencourage.acm.org/2026/index.php/join-the-hackathon/" target="_blank" rel="noopener">ACM womENcourage™ 2026 Hackathon</a>. SafeProof is a
    reporting network that uses <a href="https://en.wikipedia.org/wiki/Zero-knowledge_proof" target="_blank" rel="noopener">zero-knowledge proofs</a>
    to detect harassment patterns across platforms without exposing who reported or what
    was reported. A reporter can prove that at least <em>k</em> people reported the same target,
    and that they are one distinct, real reporter, through blinded targets, evidence
    commitments, nullifiers and a threshold proof. Survivors decide whether to come forward.
    Part of the <a href="https://github.com/TTGenProject" target="_blank" rel="noopener">TTGenProject</a> organisation.

- name: "LLMThings: Platform for Language Agents-Based Orchestration of IoT Systems"
  authors: A. Sadoudi, H.-T. Le, M. Hamidi
  website: https://llmthings.github.io/demo/
  slides: https://jdse2026.github.io/slides/Oral_pres/13_SADOUDI_LLMThings.pdf
  program: https://jdse2026.github.io/program/
  description: >-
    An experimentation platform for orchestrating IoT systems with language
    agents. Presented in the student session of <a href="https://jdse2026.github.io/program/" target="_blank" rel="noopener">JDSE 2026</a> (Junior Conference on
    Data Science and Engineering), where it received the
    <a href="https://www.ibisc.univ-evry.fr/anais-sadoudi-et-huyen-trang-le-recoivent-le-best-presentation-award-a-la-jdse-2026-english-version-below/" target="_blank" rel="noopener">Best Presentation Award</a>.
