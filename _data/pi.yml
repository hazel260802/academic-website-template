  phd:
    title: "Certified dynamic reconfiguration of Time-Sensitive Networks (TSN)"
    title_fr: "Reconfiguration dynamique certifiée des réseaux TSN"
    degree: "PhD in Computer Systems Networking and Telecommunications"
    institutions: "<a href='https://www.cnam.fr/' target='_blank' rel='noopener'>Conservatoire national des arts et métiers (Cnam)</a> and <a href='https://www.ece.fr/' target='_blank' rel='noopener'>ECE Engineering School</a>"
