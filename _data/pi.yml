    doctoral_school: "École doctorale SMI (ED 432, Sciences des métiers de l'ingénieur)"
    start: "November 2026"
    supervisors: []
    summary: >-
      Time-Sensitive Networking (TSN) promises bounded end-to-end latency for
      critical traffic, but measurements only reveal a lower bound on the
      worst-case delay. This thesis uses deterministic network calculus to
      derive provable worst-case latency bounds, and studies how to keep those
      guarantees certified when a TSN network is reconfigured at runtime.
    notes: https://cnam-ece.github.io/learning-materials/blog/why-deterministic-guarantees
    code: https://github.com/CNAM-ECE
